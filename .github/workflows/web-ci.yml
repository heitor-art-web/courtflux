name: Web quality

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "package.json"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "package.json"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
