name: Web quality

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install browser test tools
        run: npm install --no-save --ignore-scripts @playwright/test@1.55.0 @axe-core/playwright@4.10.2

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Public flow smoke tests
        run: npx playwright test --config web/playwright.config.ts public-smoke.spec.ts

      - name: Axe accessibility smoke tests
        if: always()
        run: npx playwright test --config web/playwright.config.ts accessibility.spec.ts

      - name: Authenticated flow tests
        if: always()
        env:
          COURTFLUX_E2E_EMAIL: ${{ secrets.COURTFLUX_E2E_EMAIL }}
          COURTFLUX_E2E_PASSWORD: ${{ secrets.COURTFLUX_E2E_PASSWORD }}
        run: npx playwright test --config web/playwright.config.ts authenticated.spec.ts

      - name: Onboarding keyboard tests
        if: always()
        env:
          COURTFLUX_E2E_ONBOARDING_EMAIL: ${{ secrets.COURTFLUX_E2E_ONBOARDING_EMAIL }}
          COURTFLUX_E2E_ONBOARDING_PASSWORD: ${{ secrets.COURTFLUX_E2E_ONBOARDING_PASSWORD }}
        run: npx playwright test --config web/playwright.config.ts onboarding.spec.ts

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
