name: P2 Rebuilt CI

on:
  push:
    branches: [main, p2-rebuilt]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  p2-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install minimal test dependency
        run: python -m pip install numpy
      - name: Compile P2-facing Python sources
        run: >-
          python -m compileall -q
          core services/p2 services/analytics/analyzer.py
          evaluation/p2_event_engine_test.py
          evaluation/p2_real_video_probe.py
          evaluation/p2_real_video_probe_test.py
          evaluation/p2_runtime_metrics_test.py
          evaluation/p2_ground_truth.py
          evaluation/p2_ground_truth_test.py
          evaluation/p2_frozen_fixture_test.py
          evaluation/p2_closure_test.py
          evaluation/p2_loose_lifecycle_test.py
      - name: Verify direct probe project-root bootstrap
        working-directory: evaluation
        run: >-
          python -c "import pathlib,runpy,sys;
          g=runpy.run_path('p2_real_video_probe.py');
          root=pathlib.Path.cwd().parent.resolve();
          assert g.get('PROJECT_ROOT') == root;
          assert str(root) in sys.path"
      - name: Run P2 tests
        run: >-
          python -m unittest
          evaluation.p2_event_engine_test
          evaluation.p2_real_video_probe_test
          evaluation.p2_runtime_metrics_test
          evaluation.p2_ground_truth_test
          evaluation.p2_frozen_fixture_test
          evaluation.p2_closure_test
          evaluation.p2_loose_lifecycle_test
