name: Python dependency lock

on:
  push:
    branches: [main]
    paths:
      - "requirements*.txt"
      - "requirements*.lock"
      - ".github/workflows/python-lock.yml"
  pull_request:
    branches: [main]
    paths:
      - "requirements*.txt"
      - "requirements*.lock"
      - ".github/workflows/python-lock.yml"

permissions:
  contents: read

jobs:
  python-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Seed existing lock preferences
        shell: bash
        run: |
          [[ -f requirements.lock ]] && cp requirements.lock /tmp/requirements.lock
          [[ -f requirements-tracking.lock ]] && cp requirements-tracking.lock /tmp/requirements-tracking.lock

      - name: Resolve base Python/ML lock
        run: >-
          uv pip compile requirements.txt
          --python-version 3.11
          --universal
          --output-file /tmp/requirements.lock

      - name: Resolve tracking Python/ML lock
        run: >-
          uv pip compile requirements-tracking.txt
          --python-version 3.11
          --universal
          --output-file /tmp/requirements-tracking.lock

      - name: Upload resolved lock candidates
        uses: actions/upload-artifact@v6
        with:
          name: python-lock-candidates
          path: |
            /tmp/requirements.lock
            /tmp/requirements-tracking.lock
          if-no-files-found: error
          retention-days: 1

      - name: Verify committed locks are current
        shell: bash
        run: |
          if [[ ! -f requirements.lock || ! -f requirements-tracking.lock ]]; then
            echo "Lock files are not committed yet; generated candidates are available as an artifact."
            exit 0
          fi
          diff -u requirements.lock /tmp/requirements.lock
          diff -u requirements-tracking.lock /tmp/requirements-tracking.lock
