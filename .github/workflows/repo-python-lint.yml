name: Repository Python lint

on:
  push:
    branches: [p2-rebuilt]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install "ruff==0.13.2"

      - name: Ruff correctness lint
        run: ruff check . --select E9,F63,F7,F82

      - name: Compile Python sources
        run: python -m compileall -q core services scripts tools evaluation
