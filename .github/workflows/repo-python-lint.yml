name: Repository Python lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - "ui/**"
      - ".github/workflows/repo-python-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - "ui/**"
      - ".github/workflows/repo-python-lint.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install CI Python tools
        run: >-
          python -m pip install
          "ruff==0.13.2"
          "pytest>=8.0,<9.0"
          "fastapi>=0.116.0,<1.0.0"

      - name: Ruff correctness lint
        run: ruff check . --select E9,F63,F7,F82

      - name: Compile Python sources
        run: python -m compileall -q core services scripts tools evaluation

      - name: Run lightweight Python regression tests
        run: python -m pytest -q evaluation/smart_candidate_filter_test.py

      - name: Run P3 foundation contract tests
        run: >-
          python -m pytest -q
          evaluation/p3_source_contract_test.py
          evaluation/p3_contract_v1_test.py
          evaluation/p3_game_record_test.py
          evaluation/p3_persistence_test.py
          evaluation/p3_clip_planner_test.py
          evaluation/p3_review_contract_test.py
          evaluation/p3_review_builder_test.py
          evaluation/p3_clip_generator_test.py
          evaluation/p3_review_persistence_test.py
          evaluation/p3_serialized_adapter_test.py
          evaluation/p3_artifact_store_test.py
          evaluation/p3_materializer_test.py

      - name: Run P4 spatial foundation tests
        run: python -m pytest -q evaluation/p4_*_test.py

      - name: Run worker API contract tests
        run: python -m unittest -q evaluation.worker_api_contract_test

      - name: Enforce retired P2 surfaces
        run: |
          test ! -e services/analytics/engine.py
          test ! -e services/analytics/metrics.py
          test ! -e services/p0_context_pipeline.py
          test ! -e services/renderer.py
          test ! -e services/session_config.py
          test ! -e services/vision/ball_context_features.py
          test ! -e core/game_context.py
          test ! -e evaluation/smart_ball_benchmark.py
          test ! -e app.py
          test ! -e ui
          test ! -e tools/jersey_ground_truth_app.py

      - name: Reject legacy Streamlit dependencies or imports
        run: |
          if git grep -n -i -E '(^|[^a-z])streamlit([^a-z]|$)' -- '*.py' requirements.txt; then
            echo "Legacy Streamlit surface was reintroduced. The supported frontend is web/."
            exit 1
          fi
